name: Tests
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Build k6 with xk6 extension
        run: make build

      - name: Start LDAP container for tests
        uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
        with:
          compose-file: "./test/compose.yaml"

      - name: Run tests
        run: |
          set -x
          go test ./...
