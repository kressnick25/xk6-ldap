name: Tests
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: Build k6 with xk6 extension
        run: make build

      - name: Start LDAP container for tests
        uses: hoverkraft-tech/compose-action@v3.0.0
        with:
          compose-file: "./test/compose.yaml"

      - name: Run tests
        run: |
          set -x
          go test ./...
